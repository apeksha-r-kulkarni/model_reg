<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLflow Model Registry</title>
    <meta name="description" content="Register your trained scikit-learn models directly into the MLflow Model Registry with a single click.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ── Design tokens ───────────────────────────────────────────────── */
        :root {
            --bg-base:        #0b0f1a;
            --bg-card:        rgba(255, 255, 255, 0.04);
            --bg-card-hover:  rgba(255, 255, 255, 0.07);
            --border:         rgba(255, 255, 255, 0.09);
            --border-focus:   rgba(99, 179, 237, 0.6);
            --border-drop:    rgba(99, 179, 237, 0.8);
            --accent-blue:    #63b3ed;
            --accent-purple:  #9f7aea;
            --accent-green:   #68d391;
            --accent-red:     #fc8181;
            --text-primary:   #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted:     #64748b;
            --radius-lg:      16px;
            --radius-md:      10px;
            --radius-sm:      6px;
            --shadow-glow:    0 0 40px rgba(99, 179, 237, 0.08);
            --transition:     all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── Reset & base ────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* Subtle dot-grid background */
            background-image:
                radial-gradient(circle at 20% 20%, rgba(99,179,237,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(159,122,234,0.06) 0%, transparent 50%),
                radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px;
        }

        /* ── Page header ─────────────────────────────────────────────────── */
        .page-header {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeDown 0.5s ease both;
        }

        .page-header .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 179, 237, 0.1);
            border: 1px solid rgba(99, 179, 237, 0.25);
            border-radius: 100px;
            padding: 4px 14px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-bottom: 16px;
        }

        .page-header .badge-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-blue);
            animation: pulse 2s infinite;
        }

        .page-header h1 {
            font-size: clamp(26px, 5vw, 38px);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-blue) 60%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .page-header p {
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* ── Card ────────────────────────────────────────────────────────── */
        .card {
            width: 100%;
            max-width: 580px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-glow), 0 4px 24px rgba(0,0,0,0.4);
            animation: fadeUp 0.5s ease 0.1s both;
        }

        /* ── Form elements ───────────────────────────────────────────────── */
        .field {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]::placeholder { color: var(--text-muted); }

        input[type="text"]:focus {
            border-color: var(--border-focus);
            background: rgba(99, 179, 237, 0.04);
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.12);
        }

        /* ── Drag-and-drop upload zone ───────────────────────────────────── */
        .drop-zone {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255,255,255,0.02);
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--border-drop);
            background: rgba(99, 179, 237, 0.05);
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.1);
        }

        .drop-zone.has-file {
            border-style: solid;
            border-color: rgba(104, 211, 145, 0.5);
            background: rgba(104, 211, 145, 0.04);
        }

        /* Hidden real file input, overlaid on drop zone */
        #modelFileInput {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .drop-zone-icon {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
            transition: var(--transition);
        }

        .drop-zone:hover .drop-zone-icon { transform: scale(1.1); }

        .drop-zone-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .drop-zone-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        .file-selected {
            display: none;
            align-items: center;
            gap: 10px;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent-green);
        }

        .file-selected .file-icon { font-size: 22px; }

        .drop-zone.has-file .drop-zone-content { display: none; }
        .drop-zone.has-file .file-selected { display: flex; }

        /* ── Submit button ───────────────────────────────────────────────── */
        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #4299e1 0%, #667eea 100%);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.01em;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-submit:hover:not(:disabled)::before { opacity: 1; }
        .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(66,153,225,0.35); }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* ── Spinner ─────────────────────────────────────────────────────── */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        /* ── Result panels ───────────────────────────────────────────────── */
        #resultPanel { margin-top: 28px; animation: fadeUp 0.4s ease both; }
        #resultPanel.hidden { display: none; }

        .result-card {
            border-radius: var(--radius-md);
            padding: 24px;
            border: 1px solid;
        }

        .result-card.success {
            background: rgba(104, 211, 145, 0.06);
            border-color: rgba(104, 211, 145, 0.3);
        }

        .result-card.error {
            background: rgba(252, 129, 129, 0.06);
            border-color: rgba(252, 129, 129, 0.3);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .result-icon { font-size: 22px; }

        .result-title {
            font-size: 16px;
            font-weight: 600;
        }

        .result-card.success .result-title { color: var(--accent-green); }
        .result-card.error .result-title { color: var(--accent-red); }

        /* Info grid for success details */
        .info-grid {
            display: grid;
            gap: 12px;
        }

        .info-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .info-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .info-value {
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            word-break: break-all;
            background: rgba(255,255,255,0.04);
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .info-value.highlight {
            color: var(--accent-green);
            border-color: rgba(104,211,145,0.2);
            background: rgba(104,211,145,0.05);
        }

        .error-msg {
            font-size: 14px;
            color: var(--accent-red);
            line-height: 1.6;
        }

        /* ── Divider ─────────────────────────────────────────────────────── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        /* ── Animations ──────────────────────────────────────────────────── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>

<body>

    <!-- ── Page header ────────────────────────────────────────────────── -->
    <header class="page-header">
        <div class="badge">
            <span class="badge-dot"></span>
            MLflow Model Registry
        </div>
        <h1>Register a Model</h1>
        <p>Upload a trained <code>.pkl</code> model to log and register it via MLflow.</p>
    </header>

    <!-- ── Registration card ──────────────────────────────────────────── -->
    <main class="card">
        <form id="registerForm" novalidate>

            <!-- Model Name -->
            <div class="field">
                <label for="modelNameInput">Model Name</label>
                <input
                    id="modelNameInput"
                    type="text"
                    name="model_name"
                    placeholder="e.g. simple_classifier"
                    autocomplete="off"
                    required
                >
            </div>

            <!-- File Upload -->
            <div class="field">
                <label>Model File <span style="color:var(--text-muted);text-transform:none;font-weight:400;">(.pkl)</span></label>

                <div class="drop-zone" id="dropZone">
                    <!-- Invisible real file input layered on top -->
                    <input
                        id="modelFileInput"
                        type="file"
                        name="model"
                        accept=".pkl"
                        required
                        aria-label="Upload .pkl model file"
                    >

                    <!-- Default state (no file) -->
                    <div class="drop-zone-content">
                        <span class="drop-zone-icon">📦</span>
                        <div class="drop-zone-title">Drag & drop your model here</div>
                        <div class="drop-zone-sub">or click to browse — .pkl files only</div>
                    </div>

                    <!-- File selected state -->
                    <div class="file-selected">
                        <span class="file-icon">✅</span>
                        <span id="selectedFileName">model.pkl</span>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Submit -->
            <button class="btn-submit" id="submitBtn" type="submit">
                <span class="btn-inner">
                    <span class="spinner" id="spinner"></span>
                    <span id="btnText">Register Model</span>
                </span>
            </button>

        </form>

        <!-- ── Result panel (shown after submit) ─────────────────────── -->
        <div id="resultPanel" class="hidden"></div>
    </main>


    <script>
        const form         = document.getElementById('registerForm');
        const dropZone     = document.getElementById('dropZone');
        const fileInput    = document.getElementById('modelFileInput');
        const selectedName = document.getElementById('selectedFileName');
        const submitBtn    = document.getElementById('submitBtn');
        const spinner      = document.getElementById('spinner');
        const btnText      = document.getElementById('btnText');
        const resultPanel  = document.getElementById('resultPanel');

        // ── Drag-and-drop visual feedback ─────────────────────────────────

        ['dragenter', 'dragover'].forEach(evt =>
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            })
        );

        ['dragleave', 'drop'].forEach(evt =>
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            })
        );

        dropZone.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                // Attach dropped file to the real input via DataTransfer
                const dt = new DataTransfer();
                dt.items.add(files[0]);
                fileInput.files = dt.files;
                showFileSelected(files[0].name);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                showFileSelected(fileInput.files[0].name);
            }
        });

        function showFileSelected(name) {
            selectedName.textContent = name;
            dropZone.classList.add('has-file');
        }

        // ── Form submission ────────────────────────────────────────────────

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const modelName = document.getElementById('modelNameInput').value.trim();

            // Client-side guard
            if (!modelName) {
                showError('Please enter a model name.');
                return;
            }
            if (!fileInput.files || fileInput.files.length === 0) {
                showError('Please select a .pkl file to upload.');
                return;
            }

            setLoading(true);
            resultPanel.classList.add('hidden');

            const formData = new FormData(form);

            try {
                const response = await fetch('/api/models/register/', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data);
                } else {
                    showError(data.error || 'An unknown error occurred.');
                }

            } catch (err) {
                showError(`Network error: ${err.message}`);
            } finally {
                setLoading(false);
            }
        });

        // ── UI helpers ─────────────────────────────────────────────────────

        function setLoading(loading) {
            submitBtn.disabled = loading;
            spinner.style.display = loading ? 'block' : 'none';
            btnText.textContent = loading ? 'Registering…' : 'Register Model';
        }

        function showSuccess(data) {
            resultPanel.innerHTML = `
                <div class="result-card success">
                    <div class="result-header">
                        <span class="result-icon">🎉</span>
                        <span class="result-title">Model Registered Successfully</span>
                    </div>
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="info-label">Model Name</span>
                            <span class="info-value highlight">${escHtml(data.model_name)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Version</span>
                            <span class="info-value highlight">v${escHtml(String(data.version))}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Run ID</span>
                            <span class="info-value">${escHtml(data.run_id)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Model URI</span>
                            <span class="info-value">${escHtml(data.model_uri)}</span>
                        </div>
                    </div>
                </div>
            `;
            resultPanel.classList.remove('hidden');
        }

        function showError(message) {
            resultPanel.innerHTML = `
                <div class="result-card error">
                    <div class="result-header">
                        <span class="result-icon">⚠️</span>
                        <span class="result-title">Registration Failed</span>
                    </div>
                    <p class="error-msg">${escHtml(message)}</p>
                </div>
            `;
            resultPanel.classList.remove('hidden');
        }

        // Basic HTML escape to prevent XSS from server response values
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>

</body>
</html>
